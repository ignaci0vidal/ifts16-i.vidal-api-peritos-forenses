services:
  postgres:
    image: postgres:17
    container_name: ifts16-postgres-forense
    restart: unless-stopped

    environment:
      POSTGRES_USER: forense
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configurar DB_PASSWORD en .env}
      POSTGRES_DB: forensics

    ports:
      - '127.0.0.1:5433:5432'

    volumes:
      - ifts16-postgres-data:/var/lib/postgresql/data

volumes:
  ifts16-postgres-data:
    name: ifts16-postgres-data
